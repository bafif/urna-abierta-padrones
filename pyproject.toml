[project]
name = "urna-abierta-padrones"
version = "0.1.0.dev0"
description = "Convierte padrones escaneados al formato abierto de padrón de Urna Abierta."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2",
  "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  # The last onnxruntime with wheels for Intel Macs.
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "opencv-python-headless>=4.10",
  "pypdfium2>=4.30",
  "rapidocr>=3.8",
]

[project.scripts]
urna-padrones = "urna_padrones.cli:main"
urna-padrones-lector = "urna_padrones.lector:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]
# The packaged reader: python packaging/build.py (see README).
build = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urna_padrones"]

[tool.uv]
# The packaged reader is built for these four: the lock has to have wheels for all of them.
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
