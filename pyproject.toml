[project]
name = "urna-abierta-padrones"
version = "0.1.0.dev0"
description = "Convierte padrones escaneados al formato abierto de padrón de Urna Abierta."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "pypdfium2>=4.30",
  "rapidocr>=3.8",
]

[project.scripts]
urna-padrones = "urna_padrones.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urna_padrones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
