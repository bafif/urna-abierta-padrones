name: Tests

on:
  push:
  pull_request:

env:
  # The Python that uv installs, the version in .python-version, as in the release builds.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  tests:
    # The reader is built for the three: its tests run on the three too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The scans of invented people are drawn with Liberation Sans. Where fontconfig cannot find it, as on Windows
      # and macOS, the tests that need it are skipped and the others draw with Arial.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest
